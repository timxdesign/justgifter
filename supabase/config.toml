# Supabase project configuration (local development via `supabase start`).
project_id = "justgifter"

[api]
port = 54321
schemas = ["public"]
max_rows = 500

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "https://justgifter.com", "https://staging.justgifter.com"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

# Auth emails are written by the auth-email Edge Function (Send Email hook), not dashboard templates.
# Locally: export SEND_EMAIL_HOOK_SECRET="v1,whsec_<base64>" and set enabled = true.
[auth.hook.send_email]
enabled = false
uri = "http://host.docker.internal:54321/functions/v1/auth-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

[auth.mfa]
max_enrolled_factors = 4
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
file_size_limit = "8MiB"

[functions.api]
verify_jwt = false   # public methods (catalogue, gift links) are allowed; the function checks auth per method
[functions.paystack-webhook]
verify_jwt = false   # authenticated by Paystack's HMAC signature instead
[functions.auth-email]
verify_jwt = false   # authenticated by the Standard Webhooks signature from Supabase Auth
[functions.jobs]
verify_jwt = false   # authenticated by the CRON_SECRET header
