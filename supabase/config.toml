# Supabase project configuration (local development via `supabase start`).
project_id = "justgifter"

[api]
port = 54321
schemas = ["public"]
max_rows = 500

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "https://justgifter.com", "https://staging.justgifter.com"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

# Production: configure ZeptoMail custom SMTP in the dashboard (Auth → SMTP) and paste the
# templates from supabase/templates/ (Auth → Emails → Templates). See docs/SETUP.md.
[auth.email.template.magic_link]
subject = "{{ .Token }} is your JustGifter sign-in code"
content_path = "./supabase/templates/magic-link.html"
[auth.email.template.confirmation]
subject = "{{ .Token }} is your JustGifter code"
content_path = "./supabase/templates/confirm-signup.html"
[auth.email.template.email_change]
subject = "{{ .Token }} confirms your new JustGifter email"
content_path = "./supabase/templates/email-change.html"
[auth.email.template.reauthentication]
subject = "{{ .Token }} is your JustGifter security code"
content_path = "./supabase/templates/reauthentication.html"

[auth.mfa]
max_enrolled_factors = 4
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
file_size_limit = "8MiB"

[functions.api]
verify_jwt = false   # public methods (catalogue, gift links) are allowed; the function checks auth per method
[functions.paystack-webhook]
verify_jwt = false   # authenticated by Paystack's HMAC signature instead
[functions.jobs]
verify_jwt = false   # authenticated by the CRON_SECRET header
